<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEW Ai by Hezron</title>
<style>body{font-family:sans-serif;background:#0a0a12;color:#fff;padding:12px;margin:0}h2{text-align:center;color:#a78bfa;margin:5px} p.sub{text-align:center;color:#aaa;font-size:13px;margin:0 0 10px}.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px}.tabs button{padding:8px 12px;border-radius:20px;border:1px solid #a78bfa;background:#1a1a2e;color:#fff}.tabs button.active{background:#a78bfa;color:#000;font-weight:bold}#chat{background:#1a1a2e;height:58vh;overflow:auto;padding:10px;border-radius:12px}.me{background:#a78bfa;color:#000;padding:8px;margin:5px;border-radius:10px;margin-left:20%}.ai{background:#2a2a3a;padding:8px;margin:5px;border-radius:10px;margin-right:10%}#box{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:12px;border-radius:20px;border:none}button.send{padding:12px 18px;background:#a78bfa;border:none;border-radius:20px;font-weight:bold}</style></head>
<body><h2>✨ NEW Ai</h2><p class="sub">Created by Hezron • Student at MMUST</p>
<div class="tabs"><button id="b-chat" class="active" onclick="setMode('chat')">💬 Chat</button><button id="b-video" onclick="setMode('video')">🎬 Video</button><button id="b-image" onclick="setMode('image')">🖼️ Picha</button><button id="b-scan" onclick="setMode('scan')">📷 Scan</button></div>
<div id="chat"><div class="ai">Mambo! Mimi ni <b>NEW Ai</b>, niliundwa na <b>Hezron, student wa MMUST</b>. Naweza chat, kutengeneza video scripts, ku-edit picha, na ku-scan vitu. Unataka nifanye nini leo?</div></div>
<div id="box"><input id="inp" placeholder="Andika hapa..."><button class="send" onclick="send()">Tuma</button></div>
<script>let mode='chat';function setMode(m){mode=m;['chat','video','image','scan'].forEach(x=>document.getElementById('b-'+x).classList.remove('active'));document.getElementById('b-'+m).classList.add('active');let p={chat:'Andika hapa...',video:'Elezea video unayotaka... ex: video ya biashara ya chips',image:'Elezea picha unayotaka ku-edit...',scan:'Elezea ulichoscan... ex: hii ni homework ya maths'};document.getElementById('inp').placeholder=p[m];}
async function send(){let i=document.getElementById('inp');let t=i.value.trim();if(!t)return;let c=document.getElementById('chat');c.innerHTML+='<div class="me">'+t+'</div>';i.value='';c.innerHTML+='<div class="ai" id="l">NEW Ai anaandika...</div>';c.scrollTop=c.scrollHeight;let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,mode:mode})});let d=await r.json();document.getElementById('l').remove();c.innerHTML+='<div class="ai">'+d.reply.replace(/\n/g,'<br>')+'</div>';c.scrollTop=c.scrollHeight}document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send()});</script></body></html>
